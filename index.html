
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1027">

  <title>Secret Entrance | For My Pichodaa ❤️</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="unlock">

  <div class="sky" aria-hidden="true"></div>
  <div id="particles" aria-hidden="true"></div>

  <main class="screen">
    <section class="panel">

      <div class="glow-icon float">🔐</div>

      <p class="eyebrow">A LITTLE SECRET, JUST FOR YOU</p>

      <h1>
         Bujjikondaa!!
        <span class="heart">❤️</span>
      </h1>

      <p class="message">
        I made a little universe neekosam. 🌙
      </p>

      <div class="pin-row">
        <input
          id="passcode"
          type="password"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="4"
          placeholder="••••"
          aria-label="Enter your four-digit secret code"
          autocomplete="off"
        >
      </div>

      <p id="hint" class="hint" aria-live="polite">
        Four little numbers hold your surprise ✨
      </p>

      <button id="unlock" type="button">
        Unlock My Heart 💌
      </button>

      <nav class="page-nav">
        <span></span>
        <span>1 / 10</span>
        <span>Our story begins here ♡</span>
      </nav>

    </section>
  </main>

  <script src="js/script.js" defer></script>

</body>
</html>
