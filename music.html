
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1027">

  <title>Our Song | For My Pichodaa</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="music">

  <div class="sky" aria-hidden="true"></div>
  <div id="particles" aria-hidden="true"></div>

  <main class="screen">
    <section class="panel">

      <p class="eyebrow">
        CHAPTER SEVEN · PRESS PLAY
      </p>

      <h1>Our little music corner 🎵</h1>

      <div class="record" id="record">💗</div>

      <p>
        Every cute love story deserves a soundtrack.
        
      </p>

      

      <audio
        id="song"
        src="assets/music/our-song.mp3"
        preload="none"
      ></audio>

      <button id="music-button">
        ▶ Play our song
      </button>

      <p
        id="music-status"
        class="hint"
        aria-live="polite"
      ></p>
      
      <div class="polaroid-reveal" id="polaroid-reveal" hidden>
        <div class="polaroid-frame">
          <img
            src="assets/photos/photo_5.png"
            alt="A special memory of us together"
            class="polaroid-photo"
          >
          <p class="polaroid-caption">
            You + Me, my favourite memory 💗
          </p>
        </div>

        <p class="polaroid-message">
          Every song feels more beautiful when it reminds me of you. 🥹❤️
        </p>
      </div>

      <nav class="page-nav">
        <a href="reasons.html">← Back</a>
        <span>7 / 10</span>
        <a href="love-letter.html">Next →</a>
      </nav>

    </section>
  </main>

  <script src="js/script.js" defer></script>

</body>
</html>
